---

- name: Install ValKey
  dnf:
    name: valkey

- name: Ensure vm.overcommit_memory=1 (runtime + persistent)
  become: true
  ansible.posix.sysctl:
    name: vm.overcommit_memory
    value: '1'
    state: present
    sysctl_set: true
    sysctl_file: /etc/sysctl.d/99-valkey-memory.conf
    reload: true

- name: Verify vm.overcommit_memory
  command: sysctl -n vm.overcommit_memory
  register: verify_overcommit
  changed_when: false
- debug: var=verify_overcommit.stdout

- name: Install ValKey Conf
  template:
    src: redis.conf.j2
    dest: /etc/valkey/valkey.conf
    force: true
    owner: "valkey"
    group: "valkey"
    mode: 0644

- name: Install Redis Supervisord conf
  template:
    src: supervisor.conf.j2
    dest: /etc/supervisord.d/redis.conf
    force: true
    mode: 0644

- name: Create redis run directory
  ansible.builtin.file:
    path: /run/redis
    state: directory
    mode: 0755
    owner: valkey
    group: valkey

- name: Create tmpfile.d for redis to make sure /run folder created at boot
  template:
    src: tmpfiles.conf.j2
    dest: /usr/lib/tmpfiles.d/redis.conf
    force: true
    mode: 0644

- name: Disable Redis services
  systemd_service:
    name: "{{ item }}"
    enabled: false
    state: stopped
  ignore_errors: true
  with_items:
    - "valkey-sentinel"
    - "valkey"
  when: is_systemd == True
